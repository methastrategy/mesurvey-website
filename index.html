<!DOCTYPE html>
<html lang="th" class="h-full" data-theme="fieldbook">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1eb" />
    <meta name="description" content="MESURV Platform — ระบบฐานความรู้วิศวกรรมสำรวจและภูมิสารสนเทศ เครื่องมือคำนวณรังวัดภาคสนาม และแผนที่ WebGIS มาตรฐานกรมแผนที่ทหาร (RTSD)" />
    
    <!-- Open Graph / Social Sharing Metadata (Front-End Checklist Standard) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:title" content="MESURV | Survey & Geomatics Engineering Field Terminal" />
    <meta property="og:description" content="มาตรฐานการตั้งกล้อง ขั้นตอนรังวัดภาคสนาม เครื่องมือคำนวณพิกัด/วงรอบ/ระดับ และระบบแผนที่ WebGIS สำหรับวิศวกรสำรวจ" />
    <meta property="og:url" content="https://mesurv.ku.ac.th/" />
    <meta property="og:image" content="/icon.svg" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MESURV | Survey & Geomatics Engineering Field Terminal" />
    <meta name="twitter:description" content="มาตรฐานการตั้งกล้อง ขั้นตอนรังวัดภาคสนาม เครื่องมือคำนวณพิกัด/วงรอบ/ระดับ และระบบแผนที่ WebGIS สำหรับวิศวกรสำรวจ" />
    <meta name="twitter:image" content="/icon.svg" />

    <!-- Mobile Web App & PWA Settings (Ready for .apk, .ipa, .exe packaging) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MESURV" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <title>MESURV | Survey & Geomatics Engineering Field Terminal</title>

    <!-- Google Fonts: Plus Jakarta Sans (Heading/Body), Prompt (Thai Headroom), Geist Mono & JetBrains Mono (Geodetic Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mesurv-theme') || 'fieldbook';
          var theme = (saved === 'terminal' || saved === 'fieldbook') ? saved : 'fieldbook';
          document.documentElement.setAttribute('data-theme', theme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (theme === 'terminal') {
            document.documentElement.classList.add('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#050505');
          } else {
            document.documentElement.classList.remove('dark');
            if (metaTheme) metaTheme.setAttribute('content', '#f3f1eb');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-[var(--bg)] text-[var(--text-1)] font-sans antialiased" data-theme="fieldbook">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
